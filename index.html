<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2F6BFF" />
    <title>TH EDU Companion</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      html, body, #root { height: 100%; margin: 0; }
      /* Mobile browsers: follow the visible viewport as the address bar shows / hides (tab bar never hidden). */
      @supports (height: 100dvh) { html, body, #root { height: 100dvh; } }
      body { overflow: hidden; background: #E2E8F0; overscroll-behavior: none; }
      #root { display: flex; }
      /* No grey flash on tap. */
      * { -webkit-tap-highlight-color: transparent; }
      /* iPhone zooms the page when focusing a field with text under 16px — keep form fields at 16px. */
      input, textarea, select { font-size: 16px !important; }
      /* Long-press on buttons / logo / images must not start text selection or the "Save image" callout. */
      [role="button"], [role="header"], [role="link"], [role="tab"], [role="radio"], [role="checkbox"], img {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
    </style>
    <script>
      // A few React Native libraries expect Node-style globals.
      window.global = window;
      window.process = window.process || { env: {} };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.web.tsx"></script>
  </body>
</html>
