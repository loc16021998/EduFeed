<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1278BE" />
    <title>TH EDU Companion</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      html, body, #root { height: 100%; margin: 0; }
      /* Mobile browsers: follow the visible viewport as the address bar shows / hides (tab bar never hidden). */
      @supports (height: 100dvh) { html, body, #root { height: 100dvh; } }
      body { overflow: hidden; background: #EAF3EE linear-gradient(135deg, #E1EEF8 0%, #EEF5E6 100%) fixed; overscroll-behavior: none; }
      #root { display: flex; }
      /* No grey flash on tap. */
      * { -webkit-tap-highlight-color: transparent; }
      /* iPhone zooms the page when focusing a field with text under 16px — keep form fields at 16px. */
      input, textarea, select { font-size: 16px !important; }
      /* Text fields like a normal website: no black browser outline; the field's own box turns brand blue
         with a soft ring while typing. Fields with their own border highlight themselves; search boxes
         (a borderless input inside a bordered box) highlight the box. */
      input, textarea { outline: none !important; -webkit-appearance: none; appearance: none; }
      input[type="search"]::-webkit-search-decoration, input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; }
      input[class~="border"]:focus, textarea[class~="border"]:focus,
      div[class~="border"]:has(> input:focus), div[class~="border"]:has(> textarea:focus) {
        border-color: #1278BE !important;
        box-shadow: 0 0 0 3px rgba(47, 107, 255, 0.16);
        transition: border-color 120ms ease, box-shadow 120ms ease;
      }
      /* Inputs inside a highlighted box stay plain. */
      div[class~="border"] > input:not([class~="border"]):focus { box-shadow: none; }
      /* Long-press on buttons / logo / images must not start text selection or the "Save image" callout. */
      [role="button"], [role="header"], [role="link"], [role="tab"], [role="radio"], [role="checkbox"], img {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
    </style>
    <script>
      // A few React Native libraries expect Node-style globals.
      window.global = window;
      window.process = window.process || { env: {} };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.web.tsx"></script>
  </body>
</html>
